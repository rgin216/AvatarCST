<text x="24" y="34" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600">Off-the-shelf results compared with systems trained on DementiaBank</text><text x="24" y="56" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Indicative only: published systems use different test splits, clip lengths and text normalisation.</text><rect x="24" y="96" width="12" height="12" rx="3" fill="#b5b3ab"/><text x="42" y="106" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Published, trained on DementiaBank</text><rect x="290.4" y="96" width="12" height="12" rx="3" fill="#2a78d6"/><text x="308.4" y="106" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">This app, no dementia-specific training</text><line x1="320" y1="128" x2="320" y2="304" stroke="#c3c2b7" stroke-width="1" stroke-linecap="round"/><text x="320" y="324" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">0%</text><line x1="401.6" y1="128" x2="401.6" y2="304" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="401.6" y="324" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">10%</text><line x1="483.20000000000005" y1="128" x2="483.20000000000005" y2="304" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="483.20000000000005" y="324" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">20%</text><line x1="564.8000000000001" y1="128" x2="564.8000000000001" y2="304" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="564.8000000000001" y="324" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">30%</text><line x1="646.4000000000001" y1="128" x2="646.4000000000001" y2="304" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="646.4000000000001" y="324" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">40%</text><line x1="728" y1="128" x2="728" y2="304" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="728" y="324" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">50%</text><text x="308" y="154" font-size="13" fill="#52514e" text-anchor="end" font-weight="400">Hu et al. 2023: adapted wav2vec 2.0 + Conformer</text><path d="M320,138 H464.2672 Q468.2672,138 468.2672,142 V158 Q468.2672,162 464.2672,162 H320 Z" fill="#b5b3ab"/><text x="476.2672" y="155" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">18.2%</text><text x="308" y="198" font-size="13" fill="#52514e" text-anchor="end" font-weight="400">Akinrintoyo et al. 2025: Whisper fine-tuned</text><path d="M320,182 H511.84000000000003 Q515.84,182 515.84,186 V202 Q515.84,206 511.84000000000003,206 H320 Z" fill="#b5b3ab"/><text x="523.84" y="199" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">24.0%</text><text x="308" y="242" font-size="13" fill="#52514e" text-anchor="end" font-weight="400">This app: Groq Whisper, loudest third</text><path d="M320,226 H511.42659758203797 Q515.426597582038,226 515.426597582038,230 V246 Q515.426597582038,250 511.42659758203797,250 H320 Z" fill="#2a78d6"/><text x="523.426597582038" y="243" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">23.9%</text><text x="308" y="286" font-size="13" fill="#52514e" text-anchor="end" font-weight="400">This app: Groq Whisper, all clips</text><path d="M320,270 H624.6934557979334 Q628.6934557979334,270 628.6934557979334,274 V290 Q628.6934557979334,294 624.6934557979334,294 H320 Z" fill="#2a78d6"/><text x="636.6934557979334" y="287" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">37.8%</text><text x="320" y="346" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Word error rate on the DementiaBank Pitt corpus</text>
