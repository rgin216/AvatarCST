<text x="24" y="34" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600">Removing the STT instruction prompt lowered word error rate</text><text x="24" y="56" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Before the fix, Groq returned prompt text in 35% of outputs. 531 DementiaBank clips, 50 speakers.</text><text x="24" y="74" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Bars: word error rate. Whiskers: 95% confidence interval (speaker-level bootstrap).</text><rect x="72" y="112" width="12" height="12" rx="3" fill="#2a78d6"/><text x="90" y="122" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Before: English instruction prompt</text><rect x="338.4" y="112" width="12" height="12" rx="3" fill="#eb6834"/><text x="356.4" y="122" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">After: no prompt (current app)</text><line x1="72" y1="456" x2="776" y2="456" stroke="#c3c2b7" stroke-width="1" stroke-linecap="round"/><text x="64" y="460" font-size="12" fill="#898781" text-anchor="end" font-weight="400">0%</text><line x1="72" y1="411.42857142857144" x2="776" y2="411.42857142857144" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="64" y="415.42857142857144" font-size="12" fill="#898781" text-anchor="end" font-weight="400">10%</text><line x1="72" y1="366.85714285714283" x2="776" y2="366.85714285714283" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="64" y="370.85714285714283" font-size="12" fill="#898781" text-anchor="end" font-weight="400">20%</text><line x1="72" y1="322.2857142857142" x2="776" y2="322.2857142857142" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="64" y="326.2857142857142" font-size="12" fill="#898781" text-anchor="end" font-weight="400">30%</text><line x1="72" y1="277.71428571428567" x2="776" y2="277.71428571428567" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="64" y="281.71428571428567" 